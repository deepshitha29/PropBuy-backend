services:
  - type: web
    name: propbuy-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: APP_JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://*.vercel.app,http://localhost:8080,http://localhost:5500
      - key: DEMO_MODE
        value: "true"
      - key: PORT
        value: "8080"
      # To switch from demo mode to persistent cloud MySQL (e.g. TiDB Cloud / Aiven):
      # - key: SPRING_PROFILES_ACTIVE
      #   value: default
      # - key: DB_URL
      #   value: jdbc:mysql://<host>:<port>/<db>?serverTimezone=UTC&useSSL=true
      # - key: DB_USERNAME
      #   value: <username>
      # - key: DB_PASSWORD
      #   value: <password>
